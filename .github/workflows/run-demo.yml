name: Run Crypto Demos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sha256-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run SHA-256 demo and capture logs
        run: |
          python -m encryption_demo --demo sha256 --message "Hello from GitHub Actions" 2>&1 | tee sha256-demo.log

      - name: Upload SHA-256 demo logs
        uses: actions/upload-artifact@v4
        with:
          name: sha256-demo-log
          path: sha256-demo.log

  run-aes-gcm-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run AES-GCM demo and capture logs
        run: |
          python -m encryption_demo --demo aes-gcm --message "Hello from GitHub Actions" --aad "github-actions-aad" 2>&1 | tee aes-gcm-demo.log

      - name: Upload AES-GCM demo logs
        uses: actions/upload-artifact@v4
        with:
          name: aes-gcm-demo-log
          path: aes-gcm-demo.log

  run-rsa-pss-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run RSA-PSS demo and capture logs
        run: |
          python -m encryption_demo --demo rsa-pss --message "Hello from GitHub Actions" 2>&1 | tee rsa-pss-demo.log

      - name: Upload RSA-PSS demo logs
        uses: actions/upload-artifact@v4
        with:
          name: rsa-pss-demo-log
          path: rsa-pss-demo.log

  run-ecdsa-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run ECDSA demo and capture logs
        run: |
          python - <<'PY' 2>&1 | tee ecdsa-demo.log
          import logging
          from encryption_demo.ecdsa import run_ecdsa_demo

          logging.basicConfig(level=logging.INFO, format="%(asctime)s | %(levelname)s | %(message)s")
          result = run_ecdsa_demo("Hello from GitHub Actions")
          raise SystemExit(0 if result.verified and not result.tampered_verified else 1)
          PY

      - name: Upload ECDSA demo logs
        uses: actions/upload-artifact@v4
        with:
          name: ecdsa-demo-log
          path: ecdsa-demo.log

  run-ecdhe-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run ECDHE demo and capture logs
        run: |
          python - <<'PY' 2>&1 | tee ecdhe-demo.log
          import logging
          from encryption_demo.ecdhe import run_ecdhe_demo

          logging.basicConfig(level=logging.INFO, format="%(asctime)s | %(levelname)s | %(message)s")
          result = run_ecdhe_demo()
          raise SystemExit(0 if result.shared_secret_matches and result.derived_key_matches else 1)
          PY

      - name: Upload ECDHE demo logs
        uses: actions/upload-artifact@v4
        with:
          name: ecdhe-demo-log
          path: ecdhe-demo.log

  run-hmac-sha256-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run HMAC-SHA256 demo and capture logs
        run: |
          python - <<'PY' 2>&1 | tee hmac-sha256-demo.log
          import logging
          from encryption_demo.hmac_sha256 import run_hmac_sha256_demo

          logging.basicConfig(level=logging.INFO, format="%(asctime)s | %(levelname)s | %(message)s")
          result = run_hmac_sha256_demo("Hello from GitHub Actions", "github-actions-secret-key")
          raise SystemExit(0 if result.verified and not result.tampered_verified and not result.wrong_key_verified else 1)
          PY

      - name: Upload HMAC-SHA256 demo logs
        uses: actions/upload-artifact@v4
        with:
          name: hmac-sha256-demo-log
          path: hmac-sha256-demo.log

  run-ml-kem-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run ML-KEM demo and capture logs
        run: |
          python -m encryption_demo --demo ml-kem 2>&1 | tee ml-kem-demo.log

      - name: Upload ML-KEM demo logs
        uses: actions/upload-artifact@v4
        with:
          name: ml-kem-demo-log
          path: ml-kem-demo.log

  run-ml-dsa-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run ML-DSA demo and capture logs
        run: |
          python -m encryption_demo --demo ml-dsa --message "Hello from GitHub Actions" 2>&1 | tee ml-dsa-demo.log

      - name: Upload ML-DSA demo logs
        uses: actions/upload-artifact@v4
        with:
          name: ml-dsa-demo-log
          path: ml-dsa-demo.log
