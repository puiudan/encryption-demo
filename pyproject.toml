[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-demos"
version = "0.1.0"
description = "A Python cryptography learning demo for ECDSA, ECDHE, and HMAC-SHA256."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
